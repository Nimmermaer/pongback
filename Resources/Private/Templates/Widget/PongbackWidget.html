<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Widget/Widget" />
<f:section name="main">
    <f:if condition="{pending}">
        <p><strong><f:translate key="LLL:EXT:pongback/Resources/Private/Language/locallang_be.xlf:widgets.pongback.pending" arguments="{0: pending}" /></strong></p>
    </f:if>
    <f:if condition="{sendingProblems}">
        <p class="text-danger"><f:translate key="LLL:EXT:pongback/Resources/Private/Language/locallang_be.xlf:widgets.pongback.sendingProblems" arguments="{0: sendingProblems}" /></p>
    </f:if>
    <f:if condition="{items}">
        <f:then>
            <ul class="list-unstyled">
                <f:for each="{items}" as="item">
                    <li class="mb-2">
                        <a href="{item.source_link}" target="_blank" rel="noreferrer noopener">{f:if(condition: item.source_title, then: item.source_title, else: item.source_link)}</a>
                        <f:if condition="{item.hidden}"><span class="badge badge-warning"><f:translate key="LLL:EXT:pongback/Resources/Private/Language/locallang_mod.xlf:status.pending" /></span></f:if>
                        <br>
                        <small class="text-body-secondary">{item.protocol_label} · {item.source_host} → {item.page_title} · {item.crdate -> f:format.date(format: 'Y-m-d H:i')}</small>
                    </li>
                </f:for>
            </ul>
        </f:then>
        <f:else>
            <p><f:translate key="LLL:EXT:pongback/Resources/Private/Language/locallang_be.xlf:widgets.pongback.empty" /></p>
        </f:else>
    </f:if>
</f:section>
<f:section name="footer">
    <f:render partial="Widget/Button" arguments="{button: button}" />
</f:section>
</html>
