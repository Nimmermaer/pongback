<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module"/>
<f:section name="Content">
    <h4>List of Pingbacks</h4>
    <div class="list-group">
        <f:for as="item" each="{pagination.paginator.paginatedItems}" iteration="paginationIterator">

            <a href="{be:uri.editRecord(uid:item.pid, table: 'tx_pongback_domain_model_pingback')}"
               class="list-group-item list-group-item-action"
               aria-current="true">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1">{item.uid}:{item.targetLink}{item.sourceLink}</h5>
                    <form action="{be:moduleLink(route:'pingback_list.edit')}"
                          name="site_configuration_delete_{page.siteIdentifier}"
                          id="site_configuration_delete_{page.siteIdentifier}" method="post">
                        <div class="form-check form-switch">
                            <input type="checkbox" value="{item.hidden}" data-pongback-uid="{item.uid}" class="form-check-input"
                                   id="flexSwitchCheckDefault" {f:if(condition:item.hidden, else:'checked')}/>
                            <label class="form-check-label" for="flexSwitchCheckDefault">Enable Pingback</label>
                        </div>
                    </form>
                </div>

                {item.sourceLink}
            </a>
        </f:for>
        <ul class="pagination">
            <f:for each="{pagination.pagination.allPageNumbers}" as="page">
                <li class="page-item">
                    <a href="{f:be.uri(route: 'pingback_list', parameters: '{currentPageNumber:page}')}"
                       class="page-link {f:if(condition:'{currentPageNumber}=={page}',then:'active')}">
                        {page}
                    </a>
                </li>
            </f:for>
        </ul>
    </div>
</f:section>
</html>
