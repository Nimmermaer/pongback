<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="main">
    <f:if condition="{pingbacks}">
        <ul class="tx-pongback-latest">
            <f:for each="{pingbacks}" as="pingback">
                <f:render partial="List/Item" arguments="{pingback: pingback}" />
            </f:for>
        </ul>
    </f:if>
</f:section>
</html>
