<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="main">
    <f:if condition="{paginator.paginatedItems}">
        <f:then>
            <ul class="tx-pongback-list">
                <f:for each="{paginator.paginatedItems}" as="pingback">
                    <f:render partial="List/Item" arguments="{pingback: pingback}" />
                </f:for>
            </ul>
            <f:render partial="List/Pagination" arguments="{paginator: paginator, pagination: pagination}" />
        </f:then>
        <f:else>
            <p><f:translate key="list.empty" /></p>
        </f:else>
    </f:if>
</f:section>
</html>
