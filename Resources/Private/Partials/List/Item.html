<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<li class="tx-pongback-item">
    <a href="{pingback.sourceLink}" rel="nofollow ugc noopener" class="tx-pongback-source">{f:if(condition: pingback.sourceTitle, then: pingback.sourceTitle, else: pingback.sourceLink)}</a>
    <f:if condition="{pingback.crdate}"><time datetime="{pingback.crdate -> f:format.date(format: 'c')}">{pingback.crdate -> f:format.date(format: 'd.m.Y')}</time></f:if>
    <f:if condition="{pingback.excerpt}"><p class="tx-pongback-excerpt">{pingback.excerpt}</p></f:if>
</li>
</html>
