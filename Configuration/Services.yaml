services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Webicorns\Pongback\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      # EXT:dashboard is optional, the widget is registered in Services.php if available
      - '../Classes/Widget/*'

  Webicorns\Pongback\Listener\PageModificationListener:
    public: true

  Webicorns\Pongback\Listener\GetWebsiteInformationEventListener:
    tags:
      - name: event.listener
        identifier: 'pongback/enhance-pongback-with-website-information'
