services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
  Webicorns\Pongback\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'
  Symfony\Component\Translation\Command\XliffLintCommand:
    public: true
    tags:
      - name: console.command
        command: 'xliff:lint'
