services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Webicorns\Pongback\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      - '../Classes/Mention/IncomingMention.php'
      - '../Classes/Mention/MentionRejected.php'
      - '../Classes/Mention/ResolvedTarget.php'
      - '../Classes/Mention/Source/CheckedAddress.php'
      - '../Classes/Mention/Source/FetchedSource.php'
      - '../Classes/Mention/Source/SourceDocument.php'
      - '../Classes/XmlRpc/MethodCall.php'
      - '../Classes/XmlRpc/MethodResponse.php'
      - '../Classes/Sending/PingResult.php'
      - '../Classes/Sending/SendPingbacksMessage.php'
      # EXT:dashboard is optional, the widget is registered in Services.php if available
      - '../Classes/Widget/*'

  # Instantiated by the DataHandler via GeneralUtility::makeInstance()
  Webicorns\Pongback\Hooks\PageChangeHook:
    public: true
    shared: false

  Webicorns\Pongback\Mention\MentionReceiverInterface:
    alias: Webicorns\Pongback\Mention\MentionReceiver

  Webicorns\Pongback\Mention\MentionRateLimiter:
    arguments:
      $storage: '@TYPO3\CMS\Core\RateLimiter\Storage\CachingFrameworkStorage'
